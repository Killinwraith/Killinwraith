<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" role="img" aria-label="Player stats card for Hetang: level 3, 24 months of production experience, skill bars, achievements unlocked, and side quests in hiking, photography and travel.">
  <style>
    text { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
    .h { fill: #95BF47; font-size: 15px; font-weight: 700; letter-spacing: 2px; }
    .l { fill: #cfd6de; font-size: 13px; }
    .v { fill: #ffffff; font-size: 13px; font-weight: 700; }
    .dim { fill: #7d8794; font-size: 11px; }
    .ach { fill: #ffffff; font-size: 14px; font-weight: 700; }
    .sub { fill: #9aa5b1; font-size: 12px; }
    .bar { transform-box: fill-box; transform-origin: left; animation: fill 1.6s cubic-bezier(.2,.8,.2,1) both; }
    .b2 { animation-delay: .15s } .b3 { animation-delay: .3s } .b4 { animation-delay: .45s }
    .b5 { animation-delay: .6s } .b6 { animation-delay: .75s } .b7 { animation-delay: .9s }
    @keyframes fill { from { transform: scaleX(0) } to { transform: scaleX(1) } }
    .pop { opacity: 0; animation: pop .5s ease-out forwards; }
    .p1 { animation-delay: .4s } .p2 { animation-delay: .7s } .p3 { animation-delay: 1s }
    .p4 { animation-delay: 1.3s } .p5 { animation-delay: 1.6s } .p6 { animation-delay: 1.9s }
    .p7 { animation-delay: 2.3s }
    @keyframes pop { from { opacity: 0; transform: translateX(-10px) } to { opacity: 1; transform: translateX(0) } }
    .blink { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0 } }
    .xp { transform-box: fill-box; transform-origin: left; animation: xp 2.4s cubic-bezier(.2,.8,.2,1) both .3s; }
    @keyframes xp { from { transform: scaleX(0) } to { transform: scaleX(1) } }
    .shine { animation: shine 2.8s linear infinite; }
    @keyframes shine { from { transform: translateX(-60px) } to { transform: translateX(420px) } }
  </style>

  <rect x="1" y="1" width="998" height="438" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <rect x="10" y="10" width="980" height="420" rx="10" fill="none" stroke="#95BF47" stroke-opacity=".25" stroke-dasharray="4 4"/>

  <text x="40" y="52" class="h">▶ PLAYER STATS</text>

  <text x="40" y="88" class="l">PLAYER</text><text x="140" y="88" class="v">HETANG</text>
  <text x="40" y="112" class="l">CLASS</text><text x="140" y="112" class="v">Full-Stack Engineer / ML</text>
  <text x="40" y="136" class="l">LEVEL</text><text x="140" y="136" class="v">3</text><text x="158" y="136" class="dim">(co-op terms cleared: 3/3)</text>
  <text x="40" y="160" class="l">BASE</text><text x="140" y="160" class="v">Calgary, AB</text>

  <text x="40" y="196" class="l">XP</text><text x="140" y="196" class="v">24 months of production code</text><text x="374" y="196" class="v blink">_</text>
  <rect x="40" y="206" width="380" height="14" rx="7" fill="#21262d"/>
  <clipPath id="xpclip"><rect x="40" y="206" width="380" height="14" rx="7"/></clipPath>
  <g clip-path="url(#xpclip)">
    <rect class="xp" x="40" y="206" width="380" height="14" rx="7" fill="#95BF47"/>
    <rect class="shine" x="40" y="206" width="30" height="14" fill="#ffffff" opacity=".25"/>
  </g>
  <text x="420" y="236" text-anchor="end" class="dim">3 co-op terms · 1 lead role · 0 regrets</text>

  <g transform="translate(40,262)">
    <text x="0" y="10" class="l">BACKEND</text>
    <rect x="130" y="0" width="250" height="11" rx="5.5" fill="#21262d"/><rect class="bar" x="130" y="0" width="225" height="11" rx="5.5" fill="#58a6ff"/>
    <text x="0" y="32" class="l">FRONTEND</text>
    <rect x="130" y="22" width="250" height="11" rx="5.5" fill="#21262d"/><rect class="bar b2" x="130" y="22" width="190" height="11" rx="5.5" fill="#58a6ff"/>
    <text x="0" y="54" class="l">ML / AI</text>
    <rect x="130" y="44" width="250" height="11" rx="5.5" fill="#21262d"/><rect class="bar b3" x="130" y="44" width="200" height="11" rx="5.5" fill="#bc8cff"/>
    <text x="0" y="76" class="l">DEBUGGING</text>
    <rect x="130" y="66" width="250" height="11" rx="5.5" fill="#21262d"/><rect class="bar b4" x="130" y="66" width="238" height="11" rx="5.5" fill="#f0883e"/>
    <text x="0" y="98" class="l">TRAIL STAMINA</text>
    <rect x="130" y="88" width="250" height="11" rx="5.5" fill="#21262d"/><rect class="bar b5" x="130" y="88" width="212" height="11" rx="5.5" fill="#3fb950"/>
    <text x="0" y="120" class="l">PHOTO EYE</text>
    <rect x="130" y="110" width="250" height="11" rx="5.5" fill="#21262d"/><rect class="bar b6" x="130" y="110" width="200" height="11" rx="5.5" fill="#3fb950"/>
    <text x="0" y="142" class="l">COFFEE DEP.</text>
    <rect x="130" y="132" width="250" height="11" rx="5.5" fill="#21262d"/><rect class="bar b7" x="130" y="132" width="250" height="11" rx="5.5" fill="#ef476f"/>
  </g>
  <text x="420" y="426" text-anchor="end" class="dim">stats self-assessed, obviously</text>

  <line x1="470" y1="40" x2="470" y2="400" stroke="#30363d" stroke-width="2"/>

  <text x="505" y="52" class="h">🏆 ACHIEVEMENTS UNLOCKED</text>
  <g class="pop p1"><text x="505" y="90" class="ach">👑 Lead Developer</text><text x="735" y="90" class="sub">took over a production app</text></g>
  <g class="pop p2"><text x="505" y="122" class="ach">⚡ Speedrunner</text><text x="735" y="122" class="sub">117s → 22s load time</text></g>
  <g class="pop p3"><text x="505" y="154" class="ach">🧪 Test Wizard</text><text x="735" y="154" class="sub">10 days → 4 min of UAT</text></g>
  <g class="pop p4"><text x="505" y="186" class="ach">🤖 Hallucination Hunter</text><text x="735" y="186" class="sub">0 made-up numbers, 30 evals</text></g>
  <g class="pop p5"><text x="505" y="218" class="ach">🦿 Bionic Engineer</text><text x="735" y="218" class="sub">10 ms prosthetic control loop</text></g>
  <g class="pop p6"><text x="505" y="250" class="ach">🗣️ Polyglot</text><text x="735" y="250" class="sub">English · 日本語</text></g>

  <text x="505" y="298" class="h">🗺️ SIDE QUESTS · ALWAYS ON</text>
  <g class="pop p7">
    <text x="505" y="334" class="ach">🥾 Hiking</text><text x="505" y="354" class="sub">∞ trails (counting)</text>
    <text x="665" y="334" class="ach">📷 Photography</text><text x="665" y="354" class="sub">golden hour</text>
    <text x="830" y="334" class="ach">✈️ Travel</text><text x="830" y="354" class="sub">passport stamps</text>
  </g>
  <text x="960" y="426" text-anchor="end" class="dim">press START to continue</text><text x="964" y="426" class="dim blink">▌</text>
</svg>
